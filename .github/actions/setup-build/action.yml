# ビルドの準備をまとめたもの（ci.yml・release.yml から使う。docs/06_開発環境.md「CI」）。
# 先に actions/checkout で submodule ごと取っておくこと。
# 版は手元のビルドに合わせる：JDK 21、compileSdk 36、NDK・CMakeは core-llm/build.gradle.kts の ndkVersion・cmake.version。
name: ビルドの準備
description: JDK・Android SDKの部品・ccache・sherpa-onnxのAAR・Gradleのキャッシュを用意する

inputs:
  ndk-version:
    description: NDKの版（core-llm/build.gradle.kts の ndkVersion と同じにする）
    default: "29.0.14206865"
  cmake-version:
    description: CMakeの版（core-llm/build.gradle.kts の cmake.version と同じにする）
    default: "3.31.6"
  build-tools-version:
    description: build-toolsの版（apksigner を使う）
    default: "36.0.0"

runs:
  using: composite
  steps:
    - name: JDK 21
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: "21"

    - name: Android SDKの部品（platform・build-tools・NDK・CMake）
      shell: bash
      run: |
        # ndkVersion・cmake.version が build.gradle.kts とずれていないか確かめる
        grep -q "ndkVersion = \"${{ inputs.ndk-version }}\"" core-llm/build.gradle.kts \
          || { echo "::error::NDKの版が core-llm/build.gradle.kts の ndkVersion と違います"; exit 1; }
        grep -q "version = \"${{ inputs.cmake-version }}\"" core-llm/build.gradle.kts \
          || { echo "::error::CMakeの版が core-llm/build.gradle.kts の cmake.version と違います"; exit 1; }
        # yes はsdkmanagerが終わると書き込み先を失って異常終了する。pipefail で失敗扱いにならないよう、終了コードを捨てる
        (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
          "platforms;android-36" \
          "build-tools;${{ inputs.build-tools-version }}" \
          "ndk;${{ inputs.ndk-version }}" \
          "cmake;${{ inputs.cmake-version }}" > /dev/null
        echo "$ANDROID_HOME/build-tools/${{ inputs.build-tools-version }}" >> "$GITHUB_PATH"

    # llama.cppのC/C++のコンパイル結果をccacheで使い回す。ggmlのCMakeは ccache があれば自動で使う（GGML_CCACHE）。
    # NDKは毎回入れ直すので、コンパイラーは更新日時ではなく中身で見分ける
    - name: ccache
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ccache > /dev/null
        {
          echo "CCACHE_DIR=$HOME/.cache/ccache"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_MAXSIZE=1G"
        } >> "$GITHUB_ENV"

    - name: ccacheのキャッシュ
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        # 毎回新しいキーで保存し、読むときは前回までの一番新しいものを使う
        key: ccache-${{ runner.os }}-ndk${{ inputs.ndk-version }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ccache-${{ runner.os }}-ndk${{ inputs.ndk-version }}-

    # sherpa-onnxのAARはGitに入れていない。版とハッシュは tools/get-sherpa-onnx.ps1 にあり、.sh はそこから読む
    - name: sherpa-onnxのAARのキャッシュ
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: third_party/sherpa-onnx
        key: sherpa-onnx-${{ hashFiles('tools/get-sherpa-onnx.ps1', 'gradle/libs.versions.toml') }}

    - name: sherpa-onnxのAAR（取得とハッシュの照合）
      shell: bash
      run: bash tools/get-sherpa-onnx.sh

    - name: Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # オープンソースのキャッシュの実装を使う（既定の enhanced は商用のサービス）
        cache-provider: basic
